<div class="modal fade" id="shopFormModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h6 class="modal-title" id="shopFormModalLabel">Добавить магазин</h6>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="shopForm" onsubmit="return false;">
                    <input type="hidden" id="shopId">
                    <div class="mb-3">
                        <label class="form-label small">Номер магазина</label>
                        <input type="text" class="form-control" id="shopNumber" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small">SAP-код</label>
                        <input type="text" class="form-control" id="sapCode" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small">Адрес</label>
                        <div class="fias-wrapper" style="position:relative">
                            <input type="text" class="form-control" id="shopAddress" required autocomplete="off" oninput="onAddressInput()" onblur="onAddressBlur()" onfocus="onAddressFocus()">
                            <div class="fias-suggestions dropdown-menu" id="fiasSuggestions" onmousedown="event.preventDefault()"></div>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Отмена</button>
                <button type="button" class="btn btn-primary btn-sm" id="shopFormSaveBtn" onclick="saveShop()">Сохранить</button>
            </div>
        </div>
    </div>
</div>
