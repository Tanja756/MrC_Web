<div class="modal fade" id="settingsModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header bg-primary">
                <h5 class="modal-title"><i class="bi bi-gear me-2"></i>Настройки</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="settings-section">
                    <label for="settingsWarehouse"><i class="bi bi-shop me-1"></i>Основной склад</label>
                    <select class="form-select" id="settingsWarehouse" onchange="saveProfile()">
                        <option value="">Не выбран</option>
                    </select>
                    <div class="form-text small text-muted mt-1">Будет подставляться по умолчанию на вкладке «Склад» и при подборе товаров в М15</div>
                </div>
                <hr>
                <div class="settings-section">
                    <div class="d-flex align-items-center justify-content-between">
                        <div>
                            <label class="mb-0"><i class="bi bi-palette me-1"></i>Тема оформления</label>
                            <div class="form-text small text-muted mt-0" id="themeLabel">Светлая</div>
                        </div>
                        <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" role="switch" aria-checked="false"></button>
                    </div>
                </div>
                <hr>
                <div class="settings-section">
                    <div class="d-flex align-items-center justify-content-between">
                        <div>
                            <label class="mb-0"><i class="bi bi-cloud-arrow-up me-1"></i>Авто-генерация документов</label>
                            <div class="form-text small text-muted mt-0">Для новых свободных заявок</div>
                        </div>
                        <button class="theme-toggle" id="autoGenerateDocsToggle" onclick="toggleAutoGenerateDocs()" role="switch" aria-checked="false"></button>
                    </div>
                    <div class="mt-2 d-none" id="autoGenerateDocsSub">
                        <div class="form-check form-switch mb-1">
                            <input class="form-check-input" type="checkbox" id="autoIncludeAct" checked>
                            <label class="form-check-label small" for="autoIncludeAct">Акт выполненных работ (АВР)</label>
                        </div>
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" id="autoIncludeM15" checked>
                            <label class="form-check-label small" for="autoIncludeM15">Накладная М-15</label>
                        </div>
                    </div>
                </div>
                <hr>
                <div class="settings-section d-none" id="installAppSection">
                    <label class="mb-2"><i class="bi bi-download me-1"></i>Установить приложение</label>
                    <p class="small text-muted mb-2">Добавьте Mr.Check на главный экран для быстрого доступа</p>
                    <button class="btn btn-primary w-100" id="installAppBtn" onclick="installApp()">
                        <i class="bi bi-phone me-1"></i>Установить приложение
                    </button>
                </div>
                <hr>
                <div class="settings-section">
                    <label class="mb-2"><i class="bi bi-eraser me-1"></i>Кеш пользователя</label>
                    <p class="small text-muted mb-2">Очищает сохранённые уведомления, снимки складов, push-подписки и сохранённый пароль. Потребуется повторный вход.</p>
                    <button class="btn btn-outline-danger w-100" onclick="clearUserCache()">
                        <i class="bi bi-trash3 me-1"></i>Очистить кеш
                    </button>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="saveProfile()" data-bs-dismiss="modal">Закрыть</button>
            </div>
        </div>
    </div>
</div>
