{% extends "base.html" %}
{% block content %}
<div class="container d-flex align-items-center justify-content-center min-vh-100">
    <div class="card shadow-sm" style="width: 100%; max-width: 420px;">
        <div class="card-body p-4">
            <h3 class="card-title text-center mb-4">
                <i class="bi bi-box-seam me-2"></i>Mr.Check
            </h3>

            {% for category, message in get_flashed_messages(with_categories=true) %}
            <div class="alert alert-{{ category }} alert-dismissible fade show">{{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            {% endfor %}

            <form method="POST">
                <input type="hidden" name="csrf_token" value="{{ session.csrf_token }}">
                <div class="mb-3">
                    <label class="form-label">Имя пользователя</label>
                    <input type="text" name="username" class="form-control" placeholder="Имя пользователя" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Пароль</label>
                    <input type="password" name="password" class="form-control" placeholder="Пароль" required>
                </div>

                <button type="submit" class="btn btn-primary w-100 btn-lg">Войти</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
